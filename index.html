<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ning" />
  <title>Ning ・ 我們的小本子</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Ning <span>我們的小本子</span></h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="calendar" role="tab">📅 行事曆</button>
      <button class="tab" data-view="places" role="tab">📍 想去的地方</button>
    </nav>
  </header>

  <main>
    <!-- ============ 行事曆 ============ -->
    <section id="view-calendar" class="view active">
      <div class="person-switch" id="personSwitch">
        <button data-person="瓜甯" class="active">瓜甯</button>
        <button data-person="阿瓜">阿瓜</button>
        <button data-person="both">兩人一起看</button>
      </div>

      <div class="month-bar">
        <button class="icon-btn" id="prevMonth" aria-label="上個月">‹</button>
        <div class="month-title" id="monthTitle"></div>
        <button class="icon-btn" id="nextMonth" aria-label="下個月">›</button>
        <button class="chip" id="goToday">今天</button>
      </div>

      <div class="tool-bar" id="toolBar">
        <span class="tool-label">點日期就會：</span>
        <button class="tool work active" data-tool="work">💼 一般上班</button>
        <button class="tool duty" data-tool="duty">🌙 值班</button>
        <button class="tool clear" data-tool="clear">🧽 清除</button>
      </div>

      <div class="calendar" id="calendar"></div>

      <div class="cal-footer">
        <div class="stats" id="monthStats"></div>
        <div class="bulk" id="bulkActions">
          <button class="chip" id="fillWeekdays">本月平日全設上班</button>
          <button class="chip ghost" id="clearMonth">清空本月</button>
        </div>
      </div>
      <p class="hint" id="calHint">選好上方的「一般上班 / 值班」，再點日期就能一鍵加上；再點一次同一天可取消。</p>
    </section>

    <!-- ============ 想去的地方 ============ -->
    <section id="view-places" class="view">
      <form class="add-place" id="addPlaceForm" autocomplete="off">
        <div class="add-row">
          <input id="placeQuery" type="text" placeholder="輸入店名或景點，例如：阿宗麵線、九份老街" required />
          <button type="submit" class="primary">搜尋</button>
        </div>
        <input id="placeHint" type="text" placeholder="（選填）地區或地址，讓搜尋更準，例如：台中 / 西屯區" />
        <p class="mini">也可以直接貼上 Google 地圖的完整網址。</p>
      </form>

      <div id="searchResults" class="search-results hidden"></div>

      <div class="filters">
        <div class="seg" id="catFilter">
          <button data-cat="all" class="active">全部</button>
          <button data-cat="food">🍜 美食</button>
          <button data-cat="spot">🏞️ 景點</button>
        </div>
        <select id="countyFilter"></select>
        <label class="check"><input type="checkbox" id="showVisited" /> 顯示去過的</label>
      </div>

      <div id="map" class="map"></div>

      <div id="placeList" class="place-list"></div>
    </section>
  </main>

  <footer class="app-footer">
    <details>
      <summary>資料備份 / 換手機</summary>
      <p>資料存在這台裝置的瀏覽器裡，關掉也不會消失。換手機或要同步給對方時，可以先匯出再匯入。</p>
      <div class="backup-row">
        <button class="chip" id="exportBtn">⬇️ 匯出備份</button>
        <label class="chip file-chip">⬆️ 匯入備份<input type="file" id="importFile" accept="application/json" hidden /></label>
      </div>
    </details>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- 編輯地點 -->
  <dialog id="placeDialog">
    <form method="dialog" id="placeEditForm">
      <h3>編輯地點</h3>
      <label>名稱<input id="editName" type="text" required /></label>
      <label>分類
        <select id="editCat">
          <option value="food">🍜 美食</option>
          <option value="spot">🏞️ 景點</option>
        </select>
      </label>
      <label>縣市<select id="editCounty"></select></label>
      <label>備註<input id="editNote" type="text" placeholder="想吃什麼、營業時間…" /></label>
      <div class="dialog-actions">
        <button value="delete" class="danger" id="deletePlaceBtn">刪除</button>
        <span class="spacer"></span>
        <button value="cancel">取消</button>
        <button value="save" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/places.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
